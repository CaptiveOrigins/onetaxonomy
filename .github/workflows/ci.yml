name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Leak check (emails and build output; private terms are only checked locally)
        run: bash scripts/leak-check.sh
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Packages test against each other's built output.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
